<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2f6b57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="かたちラボ">
<title>かたちラボ（試作）</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="app/ui/tokens.css">
<link rel="stylesheet" href="app/ui/base.css">
</head>
<body>
<div id="app">
  <canvas id="stage" aria-label="カッターマットの うえの かたち"></canvas>

  <header class="top app-screen" id="topBar" hidden>
    <div class="unit">
      <button class="icon-btn" id="homeBtn" type="button" aria-label="ちずに もどる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3.5 6.5v13L9 17l6 2.5 5.5-2.5v-13L15 6.5 9 4z"/><path d="M9 4v13M15 6.5v13"/></svg></button>
      <span class="grade" id="gradeTag">2ねん</span><h1 id="unitTitle"></h1>
    </div>
    <div class="tools">
      <button class="icon-btn mission-btn" id="missionBtn" type="button" aria-label="きょうの ミッション"><span class="av" id="mAv">こ</span><span id="mCount">0/3</span></button>
      <button class="icon-btn" id="parentBtn" type="button" aria-label="おうちのひとへ（ながおし）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg>
        <svg class="hold-ring" viewBox="0 0 54 54" aria-hidden="true"><rect x="2" y="2" width="50" height="50" rx="15" pathLength="200"/></svg>
      </button>
      <button class="icon-btn" id="soundBtn" type="button" aria-label="おとを けす" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w1" d="M15.5 9a4 4 0 0 1 0 6"/><path class="w2" d="M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5m0-5l-5 5"/></svg>
      </button>
    </div>
  </header>

  <div class="hud off" id="caption" aria-live="polite"><button class="say" type="button" aria-label="もういちど きく"></button><span class="txt"></span></div>
  <div class="hud toast" id="toast" hidden aria-live="polite"><button class="say" type="button" aria-label="もういちど きく"></button><span class="mk"></span><span class="txt"></span></div>
  <div class="counter" id="counter" hidden><span class="lab" id="cLab">めん</span><span class="num" id="cNum">0</span><span class="unitw" id="cUnit">つ</span></div>

  <section class="dock app-screen" id="dock" hidden>
    <div class="row" id="actRow" hidden><div class="seg" role="group" id="actSeg" aria-label="あそびかた"></div></div>
    <div class="panel" id="panel"></div>
    <nav class="tabs" role="tablist" aria-label="まなびかた">
      <button class="tab" role="tab" data-mode="miru" aria-selected="true"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></span>みる</button>
      <button class="tab" role="tab" data-mode="sawaru" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.6 1.6 0 0 1 3.2 0V11"/><path d="M12.2 10V8.6a1.6 1.6 0 0 1 3.2 0V11"/><path d="M15.4 10.4a1.6 1.6 0 0 1 3.2 0V15a6 6 0 0 1-6 6h-.8a6 6 0 0 1-4.6-2.2L4.6 15.6a1.6 1.6 0 0 1 2.5-2L9 15.5"/></svg></span>さわる</button>
      <button class="tab" role="tab" data-mode="tamesu" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="7.5" cy="12" r="4.5"/><path d="M14.5 8l7 8M21.5 8l-7 8"/></svg></span>ためす</button>
      <button class="tab" role="tab" data-mode="tsukuru" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7.5" height="7.5"/><rect x="13" y="3.5" width="7.5" height="7.5" stroke-dasharray="2.4 2"/><rect x="3.5" y="13" width="7.5" height="7.5" stroke-dasharray="2.4 2"/><path d="M16.75 14v6M13.75 17h6" stroke-linecap="round"/></svg></span>つくる</button>
      <button class="tab" role="tab" data-mode="zukan" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 3.5 5v13.5c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5V20"/></svg></span>ずかん</button>
    </nav>
  </section>

  <!-- 地図（ホーム） -->
  <section class="home" id="home">
    <div class="home-head">
      <h1>かたちラボ<small>しさく</small></h1>
      <div class="tools">
        <button class="icon-btn mission-btn" id="homeMissionBtn" type="button" aria-label="きょうの ミッション"><span class="av" id="hAv">こ</span><span id="hCount">0/3</span></button>
        <button class="icon-btn" id="homeParentBtn" type="button" aria-label="おうちのひとへ（ながおし）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg>
          <svg class="hold-ring" viewBox="0 0 54 54" aria-hidden="true"><rect x="2" y="2" width="50" height="50" rx="15" pathLength="200"/></svg>
        </button>
      </div>
    </div>
    <div class="map" id="map"></div>
  </section>

  <!-- ずかん -->
  <div class="sheet" id="zukanSheet" hidden>
    <div class="sheet-card" role="dialog" aria-labelledby="zTitle">
      <div class="sheet-head">
        <span class="grade" id="zGrade">2ねん</span>
        <h2 id="zTitle">ずかん</h2>
        <span class="cnt" id="zCount"></span>
        <button class="icon-btn" type="button" id="zClose" aria-label="とじる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="row" id="zTabsRow" hidden><div class="seg" role="group" id="zTabs" aria-label="ずかんの しゅるい"></div></div>
      <div id="zBody" class="zsec"></div>
    </div>
  </div>

  <!-- かみで つくる -->
  <div class="sheet" id="paperSheet" hidden>
    <div class="sheet-card" role="dialog" aria-labelledby="pTitle">
      <div class="sheet-head">
        <h2 id="pTitle">かみで つくる</h2>
        <button class="icon-btn" type="button" id="pClose" aria-label="とじる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="paper-wrap"><canvas id="paperCanvas" width="630" height="891"></canvas></div>
      <div class="row">
        <button class="btn" type="button" id="pPrint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="8" rx="2"/><path d="M7 14h10v6.5H7z"/></svg>いんさつ</button>
        <button class="btn sub" type="button" id="pSave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></svg>PDFで ほぞん</button>
        <button class="btn sub" type="button" id="pDone">とじる</button>
      </div>
      <p class="note" id="pNote"></p>
    </div>
  </div>

  <!-- きょうの ミッション -->
  <div class="sheet" id="missionSheet" hidden>
    <div class="sheet-card" role="dialog" aria-labelledby="msTitle">
      <div class="sheet-head">
        <h2 id="msTitle">きょうの ミッション</h2>
        <button class="icon-btn" type="button" id="msClose" aria-label="とじる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="who" id="msWho" aria-label="だれが あそぶ？"></div>
      <div id="msBody"></div>
    </div>
  </div>

  <!-- おうちのひとへ -->
  <div class="sheet parent" id="parentSheet" hidden>
    <div class="sheet-card" role="dialog" aria-labelledby="prTitle">
      <div class="sheet-head">
        <h2 id="prTitle">おうちのひとへ</h2>
        <button class="icon-btn" type="button" id="prClose" aria-label="とじる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div id="prBody"></div>
    </div>
  </div>

  <!-- ひとやすみ -->
  <div class="sheet center" id="breakSheet" hidden>
    <div class="sheet-card break-card" role="dialog" aria-labelledby="bkTitle">
      <h2 id="bkTitle">ひと やすみ しよう</h2>
      <p class="note">めを とじて、とおくを みよう。<br>かたを くるっと まわそう。</p>
      <div class="big" id="bkNum">30</div>
      <button class="btn" type="button" id="bkGo" hidden>つづける</button>
    </div>
  </div>
</div>
<div id="printArea"></div>
<script type="module" src="app/main.js"></script>
</body>
</html>
